<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="256" height="256" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d6dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6620d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0b888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d7a47;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="#1a0b2e"/>
  
  <!-- Outer circle -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- Inner gradient circle -->
  <circle cx="128" cy="128" r="110" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Decorative squares -->
  <rect x="85" y="85" width="15" height="15" fill="url(#grad2)" opacity="0.7" transform="rotate(45 92.5 92.5)"/>
  <rect x="156" y="85" width="15" height="15" fill="url(#grad2)" opacity="0.7" transform="rotate(45 163.5 92.5)"/>
  <rect x="85" y="156" width="15" height="15" fill="url(#grad2)" opacity="0.7" transform="rotate(45 92.5 163.5)"/>
  <rect x="156" y="156" width="15" height="15" fill="url(#grad2)" opacity="0.7" transform="rotate(45 163.5 163.5)"/>
  
  <!-- Central symbol (cross/spirit) -->
  <g transform="translate(128, 128)">
    <!-- Vertical line -->
    <rect x="-3" y="-40" width="6" height="80" fill="url(#grad1)" rx="3"/>
    <!-- Horizontal line -->
    <rect x="-40" y="-3" width="80" height="6" fill="url(#grad1)" rx="3"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="url(#grad2)"/>
  </g>
  
  <!-- Spiritual glow effect -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.3"/>
  
  <!-- Text -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#9d6dff">
    NC
  </text>
</svg>
